    &quot;message&quot;,

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;

&lt;h2&gt;基于 protenix 的 运行流程及相关硬件联动需求&lt;/h2&gt;
&lt;div class=&quot;intro&quot;&gt;
 &lt;p&gt;&lt;strong&gt;分别能跑通，与两个任务能同时跑，是两项验收。&lt;/strong&gt;单张 96 GB 也可尝试两工具共享 GPU；不是卡数为一就必须挨个跑。&lt;/p&gt;
 &lt;p class=&quot;muted&quot;&gt;以下是运行安排，未读取服务器；显存显示卡容量，模型实际占用尚未测量。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;controls&quot;&gt;
 &lt;label for=&quot;pc-model&quot;&gt;按租赁实物选择显卡&lt;select id=&quot;pc-model&quot;&gt;&lt;option value=&quot;unknown48&quot;&gt;48 GB 卡，具体型号待确认&lt;/option&gt;&lt;option value=&quot;ada48&quot;&gt;RTX 6000 Ada · 48 GB&lt;/option&gt;&lt;option value=&quot;l2048&quot;&gt;L20 · 48 GB&lt;/option&gt;&lt;option value=&quot;pro500048&quot;&gt;RTX PRO 5000 Blackwell · 48 GB&lt;/option&gt;&lt;option value=&quot;pro500072&quot;&gt;RTX PRO 5000 Blackwell · 72 GB&lt;/option&gt;&lt;option value=&quot;pro600096&quot;&gt;RTX PRO 6000 Blackwell · 96 GB&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label for=&quot;pc-layout&quot;&gt;卡数与运行方式&lt;select id=&quot;pc-layout&quot;&gt;&lt;option value=&quot;dual&quot;&gt;一台双卡，各用一张&lt;/option&gt;&lt;option value=&quot;single&quot;&gt;一台单卡，两任务共享 GPU&lt;/option&gt;&lt;option value=&quot;queue&quot;&gt;一台单卡，主动排队运行&lt;/option&gt;&lt;option value=&quot;split&quot;&gt;两台机器，各一张卡&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label for=&quot;pc-ram&quot;&gt;&lt;span id=&quot;pc-ram-label&quot;&gt;整机内存&lt;/span&gt;&lt;select id=&quot;pc-ram&quot;&gt;&lt;option value=&quot;128&quot;&gt;128 GB&lt;/option&gt;&lt;option value=&quot;256&quot;&gt;256 GB（租得到时再选）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label for=&quot;pc-relation&quot;&gt;现在要做的任务&lt;select id=&quot;pc-relation&quot;&gt;&lt;option value=&quot;cross&quot;&gt;输入各自就绪：一项预测＋一项设计&lt;/option&gt;&lt;option value=&quot;new&quot;&gt;同一新项目，从目标序列开始&lt;/option&gt;&lt;option value=&quot;known&quot;&gt;已有确认结构，直接设计&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label for=&quot;pc-condition&quot; id=&quot;pc-condition-label&quot; class=&quot;control-wide&quot;&gt;查看两任务同时试跑的情况&lt;select id=&quot;pc-condition&quot;&gt;&lt;option value=&quot;untested&quot;&gt;尚未实测：先尝试两任务重叠&lt;/option&gt;&lt;option value=&quot;fit&quot;&gt;试跑满足时：显存与内存都有余量&lt;/option&gt;&lt;option value=&quot;vram&quot;&gt;同卡显存不足时：设计等待&lt;/option&gt;&lt;option value=&quot;pressure&quot;&gt;内存吃紧时：后启动的设计等待&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label for=&quot;pc-stage&quot; id=&quot;pc-stage-label&quot; class=&quot;control-wide&quot; hidden&gt;这个项目进行到哪一步&lt;select id=&quot;pc-stage&quot;&gt;&lt;option value=&quot;predicting&quot;&gt;正在预测，结构还没出来&lt;/option&gt;&lt;option value=&quot;handoff&quot;&gt;预测已结束，结构文件尚未核验交接&lt;/option&gt;&lt;option value=&quot;review&quot;&gt;结构已就绪，设计区域尚未确认&lt;/option&gt;&lt;option value=&quot;ready&quot;&gt;结构文件与设计条件全部就绪&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div id=&quot;pc-plan-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;versions&quot;&gt;
 &lt;h3&gt;起测只跑这一小批&lt;/h3&gt;
 &lt;p&gt;Protenix：&lt;code&gt;protenix_base_default_v1.0.0&lt;/code&gt;，先跑官方 693 残基样例。PXDesign：生成器 v0.1.0、内部 Protenix v0.5.0+pxd；官方 PD-L1 样例（116 残基目标＋80 残基设计链），完整模式先生成 10 个骨架，再做序列设计和内部筛选。&lt;/p&gt;
 &lt;p class=&quot;muted&quot;&gt;分别跑通：两工具各自交出完整结果。同时跑通：重叠期间两任务都有进展，最终都完成，覆盖 PXDesign 内部筛选；不能只看两个进程已启动。两项验收当前均未实测。&lt;/p&gt;
&lt;/div&gt;
&lt;p class=&quot;sources&quot;&gt;依据：&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/README.md#running-pxdesign&quot;&gt;PXDesign 固定版本与调试说明&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/examples/input.json&quot;&gt;Protenix 固定样例&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-5000/&quot;&gt;PRO 5000 规格&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000/&quot;&gt;PRO 6000 规格&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://docs.nvidia.com/deploy/nvidia-smi/index.html#compute-mode&quot;&gt;单卡多进程规则&lt;/a&gt;&lt;/p&gt;
&lt;script&gt;
(()=&gt;{

const layouts=[&#x27;dual&#x27;,&#x27;single&#x27;,&#x27;queue&#x27;,&#x27;split&#x27;],relations=[&#x27;cross&#x27;,&#x27;new&#x27;,&#x27;known&#x27;],stages=[&#x27;predicting&#x27;,&#x27;handoff&#x27;,&#x27;review&#x27;,&#x27;ready&#x27;],conditions=[&#x27;untested&#x27;,&#x27;fit&#x27;,&#x27;vram&#x27;,&#x27;pressure&#x27;];

function planView(s=state){
