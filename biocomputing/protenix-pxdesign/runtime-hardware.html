&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;div class=&quot;window&quot;&gt;
&lt;header&gt;
 &lt;div class=&quot;note&quot;&gt;Phase I · 独立 Linux · 官方依据与待试跑负载，模型峰值未实测 · 核验日期 2026-10-15&lt;/div&gt;
 &lt;h2&gt;基于 protenix 的 运行流程及相关硬件联动需求&lt;/h2&gt;
 &lt;p&gt;同一台机器、不同项目：准备输入、结构预测、候选设计、整理结果、查看下载同时推进。每项计算使用各自已经就绪的输入。&lt;/p&gt;
 &lt;p&gt;&lt;span class=&quot;tag done&quot;&gt;单卡试租候选 · 尚未验收&lt;/span&gt;RTX 6000 Ada 48 GB＋256 GB 内存＋32 物理核＋2 TB 系统盘／4 TB 数据盘。用于调试与小批量内测的试租目标；没有同版本、同输入的实测前，不作为采购定型。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;Protenix 与 PXDesign 的模型计算都用 GPU。单卡默认一次执行一个完整 GPU 任务，另一项排队；CPU 输入准备、结果整理和查看继续并行。单次输入规模与采样配置决定显存需求，小批量不代表单任务一定省显存。&lt;/p&gt;
&lt;/header&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-evidence&quot;&gt;
 &lt;h3&gt;先看依据：哪些数字能参考，哪些还不知道&lt;/h3&gt;
 &lt;p&gt;&lt;strong&gt;已纠正：&lt;/strong&gt;原页面 B 的“32 GB 显存／48 GB 内存”、C 的“40／64 GB”没有对应的模型实测；它们只是演示排队规则的任意输入。不能从这些数值推导 48／72／96 GB 卡能承载多少任务，也不能据此采购。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;官方基准：仅在披露条件内参考；源码／样例：用于固定试跑配置；我方假设：仅演示排队。三者分开列出，本项目没有模型资源实测记录。&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-workloads&quot;&gt;
 &lt;h3&gt;把版本、输入规模和数量固定后，再测资源&lt;/h3&gt;
 &lt;p class=&quot;note&quot;&gt;以下是计划验收负载，尚未执行。Protenix 固定源码 &lt;code&gt;85767b8&lt;/code&gt;；PXDesign 固定源码 &lt;code&gt;f788441&lt;/code&gt;。修改模型、长度、MSA、采样数、精度或并发方式后，需要重新测量。&lt;/p&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;计划试跑项&lt;/th&gt;&lt;th&gt;模型／环境&lt;/th&gt;&lt;th&gt;输入与输出数量&lt;/th&gt;&lt;th&gt;资源依据&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;Protenix 独立预测&lt;/td&gt;&lt;td&gt;&lt;code&gt;protenix_base_default_v1.0.0&lt;/code&gt;&lt;br&gt;PyTorch 2.7.1；BF16 混合精度（不是所有模块都用 BF16）&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/examples/input.json&quot;&gt;官方 input.json&lt;/a&gt;：1 条 693 残基标准蛋白链，1 份输入；1 个种子 101，每种子 5 份结构；10 次循环、200 个扩散步。计划启用 MSA、不用模板；实际原子数和 MSA 深度待预处理记录&lt;/td&gt;&lt;td&gt;模型和参数可由源码核实；693 是本次静态数序列得到，不是官方显存测试点。&lt;strong&gt;该负载显存／内存峰值均待测&lt;/strong&gt;，不能在官方表中插值&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;PXDesign 官方小样例&lt;/td&gt;&lt;td&gt;生成器 &lt;code&gt;pxdesign_v0.1.0&lt;/code&gt;；配套 Protenix &lt;code&gt;v0.5.0+pxd&lt;/code&gt;、PXDesignBench &lt;code&gt;v0.1.2&lt;/code&gt;；PyTorch 2.3.1／JAX 0.4.29；独立环境&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/examples/PDL1_quick_start.yaml&quot;&gt;PD-L1 Quick Start&lt;/a&gt;：5o45.cif，A 链 1–116，设计链 80 残基，预计算 MSA；合计 196 个标准残基位置，实际 token／原子数以日志为准。显式 &lt;code&gt;--preset extended --N_sample 10&lt;/code&gt;；1 轮，固定基种子 2025 并记录实际派生种子；400 步、生成分块 10；BF16、fast_ln=True、deepspeed_evo_attention=True&lt;/td&gt;&lt;td&gt;官方样例与配置；&lt;strong&gt;不是 40 GB 显存／64 GB 内存的依据&lt;/strong&gt;。10 是申请生成的原始骨架数量，不是最终通过筛选数&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;PXDesign 扩样测试&lt;/td&gt;&lt;td&gt;同上，同一输入、同一固定环境；不换成 Protenix v1／v2&lt;/td&gt;&lt;td&gt;显式指定 &lt;code&gt;--N_sample 500&lt;/code&gt;；其余配置与小样例对齐。每个骨架默认设计 1 条序列；最终通过数取决于筛选；汇总表可能保留未通过条目，不能按表的行数认定合格候选数&lt;/td&gt;&lt;td&gt;500 是我方选定的扩样档，&lt;strong&gt;不称 CLI 的生效默认值&lt;/strong&gt;。10 与 500 必须分别测完整流程；不能按候选数线性乘显存&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;Protenix v2 备选&lt;/td&gt;&lt;td&gt;精确模型名 &lt;code&gt;protenix-v2&lt;/code&gt;；与 v1 分别验收&lt;/td&gt;&lt;td&gt;若选用，先重复相同输入与采样条件，再扩大长度。固定源码对 &lt;code&gt;N_token &amp;gt; 2560&lt;/code&gt; 直接拒绝&lt;/td&gt;&lt;td&gt;没有本项目 v2 资源实测；官方显存表不能标成 v2 数据。更大的显卡不解除该软件限制&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p&gt;PXDesign 的完整流程还包括 ProteinMPNN 序列设计、AF2-IG 和 Protenix 评分。Extended 默认启用 &lt;code&gt;protenix_base_default_v0.5.0&lt;/code&gt; 评分；mini 配置存在但此 preset 默认关闭，目标判断后可能改用 &lt;code&gt;protenix_mini_tmpl_v0.5.0&lt;/code&gt;。初筛每次 1 份结构、4 次循环、2 步，最终选中且 pass_ptx=True 的子集再做 20 步复评分，没有该子集时跳过。运行时保存最终生效配置；不能只测骨架生成器就宣称整套流程可承载。该固定版本 README 提供 L20 耗时参考，未给出这套完整流程的显存／内存峰值表。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;依据：&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/configs/configs_model_type.py#L26-L108&quot;&gt;Protenix 模型配置&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/configs/configs_base.py#L146-L184&quot;&gt;公共采样配置&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/runner/inference.py#L492-L520&quot;&gt;v2 限制&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/install.sh#L240-L275&quot;&gt;PXDesign 依赖&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/pxdesign/configs/configs_base.py#L48-L84&quot;&gt;生成步数／分块&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesignBench/blob/f6d0d72496c23ca1374df5943754f3454ae8c549/pxdbench/pxd_configs/eval.py#L29-L79&quot;&gt;序列与评分配置&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/pxdesign/runner/helpers.py#L836-L845&quot;&gt;最终复评分&lt;/a&gt;&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;693 残基和 PD-L1＋80 残基结合物用于部署验收，不代表业务靶点和最终多肽长度。真实项目应另列“靶点裁剪长度＋候选长度＋链数／拷贝数”，再记录预处理得到的 token、原子数和 MSA 深度。&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-official-memory&quot;&gt;
 &lt;h3&gt;Protenix 官方显存原表：有数据，但测试条件不完整&lt;/h3&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;输入计算单元 N_token&lt;/th&gt;&lt;th&gt;原子数 N_atom&lt;/th&gt;&lt;th&gt;GPU 显存峰值 GB&lt;/th&gt;&lt;th&gt;耗时秒&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;500&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;6.1&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;18.2&lt;/td&gt;&lt;td&gt;59&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;20,000&lt;/td&gt;&lt;td&gt;66.6&lt;/td&gt;&lt;td&gt;226&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;3,000&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;td&gt;60.8&lt;/td&gt;&lt;td&gt;935&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;td&gt;78.1&lt;/td&gt;&lt;td&gt;1,424&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p&gt;&lt;strong&gt;该表没有标明：&lt;/strong&gt;具体模型、测试 GPU、种子／采样数量、MSA 深度、模板、内核与循环数；也没有 CPU 内存峰值。上方训练表的 A100-80G 不能挪作这里的测试显卡。不能将这些行归给 v1 或 v2，不能据此保证某张卡可跑某个长度。&lt;/p&gt;
 &lt;p&gt;标准蛋白中，一份输入的 token 通常按所有链的残基合计；不是只看多肽有多长。配体和修饰可能按原子拆分。原表的原子数是测试输入值，不能当成“每个残基固定 10 个原子”。源码会按长度切换部分模块精度，原表也不是单调递增；不能直接插值或外推。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;来源：&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/docs/training_inference_instructions.md#inference-cost&quot;&gt;固定版本官方推理开销表&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/protenix/data/tokenizer.py#L120-L152&quot;&gt;输入拆分规则&lt;/a&gt;。PXDesign 的 &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/README.md#L449-L461&quot;&gt;L20 耗时参考&lt;/a&gt;不能用来推算显存或内存。&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-quantity&quot;&gt;
 &lt;h3&gt;“候选数量”不等于“同时占几份显存”&lt;/h3&gt;
 &lt;p&gt;PXDesign 的 10／500 指申请生成的骨架数；每骨架默认设计 1 条序列，最终通过多少条要看筛选标记，不能只数汇总表行数。Protenix 的 &lt;code&gt;N_sample=5&lt;/code&gt; 指同一个序列输入生成 5 份结构，不是设计 5 条新序列。&lt;/p&gt;
 &lt;p&gt;例如 100 条候选，每条用 2 个种子、每种子 5 份结构，最多产生 1,000 份结构结果；失败另计。逐条跑主要增加总耗时和结果盘占用，不等于 100 个进程同时驻留。采样数增大会影响中间张量和结果汇总；有分块也不能断言峰值不变。两个独立进程重叠时，要另测两套进程树和逐卡峰值。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;来源：&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/Protenix/blob/85767b811c40ed46e73a9b39519cf6bfca8701ba/protenix/data/inference/infer_dataloader.py#L51-L65&quot;&gt;Protenix 逐输入加载&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/pxdesign/model/generator.py#L210-L230&quot;&gt;PXDesign 分块和汇总&lt;/a&gt;&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-budget-origin&quot;&gt;
 &lt;h3&gt;原演示数字的依据：全部是人为假设&lt;/h3&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;原默认项&lt;/th&gt;&lt;th&gt;演示值&lt;/th&gt;&lt;th&gt;证据与用途&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;B／E：Protenix 任务&lt;/td&gt;&lt;td&gt;显存 32 GB；内存 48 GB；CPU 6 核；新增写盘 10 GB&lt;/td&gt;&lt;td&gt;无对应版本／长度／候选数的测量，不是从官方表推导&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;C：PXDesign 完整任务&lt;/td&gt;&lt;td&gt;显存 40 GB；内存 64 GB；CPU 8 核；新增写盘 40 GB&lt;/td&gt;&lt;td&gt;无完整流程峰值测量，不能对应为 196 token、10 或 500 个骨架的需求&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;A／D：准备与整理&lt;/td&gt;&lt;td&gt;A 8 核／24 GB、写盘 40 GB；D 4 核／8 GB、写盘 20 GB&lt;/td&gt;&lt;td&gt;无实测，仅为演示 CPU 阶段与 GPU 阶段重叠；解压时 A 至少 64 GB 也是演示假设&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;系统和安全余量&lt;/td&gt;&lt;td&gt;服务 4 核／20 GB 内存；内存另留 16 GB；每卡留 4 GB&lt;/td&gt;&lt;td&gt;我方演示规则，不是 NVIDIA、Protenix 或 PXDesign 的最低要求，也不保证 OOM 安全&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;磁盘演示&lt;/td&gt;&lt;td&gt;已有 900 GB；压缩包 300 GB；解压新增 600 GB＋临时 50 GB；C 留存 20 GB；单盘系统占 200 GB；盘保留 100／200 GB&lt;/td&gt;&lt;td&gt;都不是实际下载清单／文件大小；真实空间要按所选权重、CCD、MSA／模板资料及保留结果分别盘点&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;下面收起的模拟器保留这些任意值，用于解释资源分配；与上述试跑负载的实测峰值无对应关系。&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-purchase-check&quot;&gt;
 &lt;h3&gt;采购前只补一份实测记录&lt;/h3&gt;
 &lt;p&gt;按上方固定负载，先小样例，再 500 骨架扩样；单卡验收模型排队与 CPU 步骤重叠，双卡验收两套 GPU 计算重叠。每次记录：源码与权重、GPU／驱动／CUDA／内核、最终配置、输入 token／原子数／MSA 深度、骨架／序列／通过数、进程并发数、逐卡显存峰值、整套父子进程内存峰值、磁盘峰值和耗时。&lt;/p&gt;
 &lt;p&gt;&lt;strong&gt;当前结论：&lt;/strong&gt;48 GB 显卡＋256 GB 内存＋2 TB 系统盘／4 TB 数据盘，只能作为待试租验收的候选配置。尚不能声称“已证明满足正常运行”或“已证明最低配置”；256 GB 内存及 4 TB 数据盘也没有从官方单任务表推导出来。&lt;/p&gt;
&lt;/section&gt;

&lt;details class=&quot;panel section&quot; id=&quot;pc-simulation&quot;&gt;&lt;summary&gt;假设预算推演：仅看排队规则，不判断模型承载或采购&lt;/summary&gt;&lt;p class=&quot;note&quot;&gt;以下默认数值与上方具体试跑负载没有测量对应关系。彩条和置灰只表达你输入的假设，不能当成实机占用。&lt;/p&gt;&lt;div class=&quot;simulation-controls&quot;&gt; &lt;div class=&quot;controls&quot;&gt;
  &lt;label for=&quot;pc-gpu&quot;&gt;显卡配置&lt;select id=&quot;pc-gpu&quot;&gt;&lt;option value=&quot;single48&quot;&gt;单卡 48 GB · 试租候选&lt;/option&gt;&lt;option value=&quot;dual48&quot;&gt;双卡，各 48 GB&lt;/option&gt;&lt;option value=&quot;single72&quot;&gt;单卡 72 GB · PRO 5000&lt;/option&gt;&lt;option value=&quot;single96&quot;&gt;单卡 96 GB · PRO 6000&lt;/option&gt;&lt;option value=&quot;dualmixed&quot;&gt;双卡 96＋48 GB · 扩展&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-cpu&quot;&gt;CPU 物理核&lt;select id=&quot;pc-cpu&quot;&gt;&lt;option value=&quot;16&quot;&gt;16 核&lt;/option&gt;&lt;option value=&quot;32&quot; selected&gt;32 核&lt;/option&gt;&lt;option value=&quot;64&quot;&gt;64 核&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-ram&quot;&gt;整机内存&lt;select id=&quot;pc-ram&quot;&gt;&lt;option value=&quot;128&quot;&gt;128 GB&lt;/option&gt;&lt;option value=&quot;256&quot;&gt;256 GB&lt;/option&gt;&lt;option value=&quot;512&quot;&gt;512 GB&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-disk&quot;&gt;物理硬盘&lt;select id=&quot;pc-disk&quot;&gt;&lt;option value=&quot;single&quot;&gt;2 TB 单盘&lt;/option&gt;&lt;option value=&quot;split&quot;&gt;2 TB 系统盘＋4 TB 数据盘&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-load&quot;&gt;同时发生的情况&lt;select id=&quot;pc-load&quot;&gt;&lt;option value=&quot;normal&quot;&gt;日常多阶段并发&lt;/option&gt;&lt;option value=&quot;prepare&quot;&gt;还在下载／解压资料&lt;/option&gt;&lt;option value=&quot;busy&quot;&gt;数据盘同时大量读写&lt;/option&gt;&lt;option value=&quot;low&quot;&gt;数据盘空间接近不足&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-event&quot;&gt;模拟运行情况&lt;select id=&quot;pc-event&quot; aria-describedby=&quot;pc-scenario-note&quot;&gt;&lt;option value=&quot;normal&quot;&gt;查看当前运行与排队&lt;/option&gt;&lt;option value=&quot;b_finished&quot;&gt;Protenix 算完，让出显卡&lt;/option&gt;&lt;option value=&quot;c_cancel_requested&quot;&gt;PXDesign 取消中，仍占显卡&lt;/option&gt;&lt;option value=&quot;c_cancel_done&quot;&gt;PXDesign 已取消，显卡已释放&lt;/option&gt;&lt;option value=&quot;c_failed&quot;&gt;PXDesign 失败，进程已退出&lt;/option&gt;&lt;option value=&quot;c_retry&quot;&gt;PXDesign 失败后重新排队&lt;/option&gt;&lt;option value=&quot;c_zero&quot;&gt;PXDesign 算完，零候选通过&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot; style=&quot;margin-top:9px&quot;&gt;可直接任选场景，不必按顺序点击；这不会提交、取消或重试真实任务。每卡默认一个模型重任务；显存、CPU、内存与写盘均按下方可修改预算判断，环境兼容仍须试跑。灰色任务当前不启动，详情可看原因；灰色场景尚不满足模拟前提。&lt;/p&gt;
 &lt;p id=&quot;pc-scenario-note&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
 &lt;p id=&quot;pc-disabled-reasons&quot; class=&quot;note&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;&lt;details class=&quot;panel section&quot; id=&quot;pc-budgets&quot;&gt;&lt;summary&gt;修改运行预算：用本机实测值替换这些示例&lt;/summary&gt;
 &lt;p class=&quot;note&quot;&gt;仅演示资源放行逻辑。以下均为工程演示预算，不是官方需求或预测实测值。任务预算包含父子进程树；系统／结果服务另留 4 个 CPU 物理核、20 GB 内存，内存安全余量 16 GB；每卡另留 4 GB 显存余量。没有重复相加文件缓存。&lt;/p&gt;
 &lt;div class=&quot;budget&quot;&gt;
  &lt;label for=&quot;pc-a-cpu&quot;&gt;A 准备 CPU 核&lt;input id=&quot;pc-a-cpu&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;64&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-b-cpu&quot;&gt;B／E 预测 CPU 核&lt;input id=&quot;pc-b-cpu&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;64&quot; value=&quot;6&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-c-cpu&quot;&gt;C 设计 CPU 核&lt;input id=&quot;pc-c-cpu&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;64&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-b-vram&quot;&gt;B／E 显存 GB&lt;input id=&quot;pc-b-vram&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;192&quot; value=&quot;32&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-c-vram&quot;&gt;C 显存 GB&lt;input id=&quot;pc-c-vram&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;192&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-a-ram&quot;&gt;A 准备内存 GB&lt;input id=&quot;pc-a-ram&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;512&quot; value=&quot;24&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-b-ram&quot;&gt;B／E 预测内存 GB&lt;input id=&quot;pc-b-ram&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;512&quot; value=&quot;48&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-c-ram&quot;&gt;C 设计内存 GB&lt;input id=&quot;pc-c-ram&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;512&quot; value=&quot;64&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-existing&quot;&gt;已有数据文件 GB&lt;input id=&quot;pc-existing&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;10000&quot; value=&quot;900&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-package&quot;&gt;待下载压缩包 GB&lt;input id=&quot;pc-package&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;10000&quot; value=&quot;300&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-unpack&quot;&gt;本包解压新增 GB&lt;input id=&quot;pc-unpack&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;20000&quot; value=&quot;600&quot;&gt;&lt;/label&gt;
  &lt;label for=&quot;pc-c-saved&quot;&gt;C 退出后留存 GB&lt;input id=&quot;pc-c-saved&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;解压演示按“当前压缩包＋本包解压新增＋50 GB 临时预算”计峰值，内存暂按至少 64 GB 预算；这些不是数据集大小或官方需求。日常新增写盘预算：A 40、B／E 10、C 40、D 20 GB；每个结果整理任务内存 8 GB。已有文件不含 C 本次新结果；C 退出后，把假设留存量计入已有文件，仅释放其余待写预算。硬盘采用名义容量，实机按文件系统可用空间校准。&lt;/p&gt;
&lt;/details&gt;
&lt;div class=&quot;summary&quot; id=&quot;pc-summary&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;announce&quot; id=&quot;pc-announcement&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;main&quot;&gt;
 &lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;不同项目的六项独立任务&lt;/h3&gt;&lt;div class=&quot;note&quot;&gt;A—F 是任务代号，不是步骤顺序。本例 C 已有目标结构，不等 B 本次输出，只等资源；单卡也可先跑输入已就绪的 C。真实项目若使用上游产物，须先完成并核验该产物。运行行显示已分配预算；灰色行尚未启动，显示计划需求且当前计算资源占用为 0。显存值是可修改的示例，不是模型实测。&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;pc-tasks&quot;&gt;&lt;/div&gt;&lt;/section&gt;
 &lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;硬件怎样联动&lt;/h3&gt;&lt;div class=&quot;note&quot;&gt;容量是规格；彩条是预算分配。&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;pc-resources&quot; class=&quot;resources&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;section class=&quot;panel section&quot; id=&quot;pc-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/section&gt;
&lt;section class=&quot;panel section&quot;&gt;&lt;h3&gt;在任意假设预算下，卡数怎样影响排队？&lt;/h3&gt;
 &lt;p class=&quot;note&quot;&gt;下表固定“当前运行与排队”场景，用当前 CPU、内存、磁盘和任务预算比较各显卡方案。标为“假设内可分配”只表示算术预算满足；真实模型承载仍未知。单卡 72／96 GB 增加单任务容量，仍按本页每卡一重任务策略排队。单卡多进程共享显存并非硬件绝对禁止，但完整流程峰值与干扰尚未验证，本期不作为双模型同时计算的交付方案。&lt;/p&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;显卡方案&lt;/th&gt;&lt;th&gt;两项 GPU 计算&lt;/th&gt;&lt;th&gt;原因／各自分配&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;pc-compare&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/details&gt;

&lt;section class=&quot;panel section&quot;&gt;&lt;h3&gt;哪些步骤能一起做？&lt;/h3&gt;
 &lt;p&gt;同一个项目：输入确认 → Protenix 得到结构（已有合格结构可直接使用）→ 确认设计区域 → PXDesign 生成骨架、设计序列、评分 → 整理候选。下方演示的是不同项目：B 与 C 的输入各自已就绪，因此可以讨论并行；同项目的上游结果未就绪时，加卡也不能跳过依赖。&lt;/p&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;阶段&lt;/th&gt;&lt;th&gt;单卡时&lt;/th&gt;&lt;th&gt;双卡时&lt;/th&gt;&lt;th&gt;主要资源&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;下载／解压、校验输入；选用的本地 MSA 搜索&lt;/td&gt;&lt;td&gt;可与一项模型计算并行&lt;/td&gt;&lt;td&gt;可与两项模型计算并行&lt;/td&gt;&lt;td&gt;CPU、内存、网络／磁盘；仍须预算充足。MSA 若走远端不计成本机搜索&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;Protenix 核心结构预测&lt;/td&gt;&lt;td&gt;与 PXDesign GPU 阶段轮流；等待项置灰&lt;/td&gt;&lt;td&gt;可在 GPU 0 与另一卡的 PXDesign 同时执行&lt;/td&gt;&lt;td&gt;B 的逐卡显存、CPU、内存、写盘预算&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;PXDesign 骨架生成 → ProteinMPNN 序列设计 → AF2／Protenix 评分&lt;/td&gt;&lt;td&gt;整个任务保守地占同一 GPU 名额，不能在评分时提前让卡&lt;/td&gt;&lt;td&gt;固定 GPU 1；输入就绪、容量及环境验证后与 B 并行&lt;/td&gt;&lt;td&gt;C 的完整任务峰值预算；子进程可能与生成模型重叠，不把各阶段峰值简单相加&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;所有模型父子进程退出后的结果整理、查看／下载&lt;/td&gt;&lt;td&gt;可与后续模型计算并行&lt;/td&gt;&lt;td&gt;同左&lt;/td&gt;&lt;td&gt;CPU、内存、磁盘；峰值须测量；模拟区的 D／F 数字仅为假设&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;panel section&quot;&gt;&lt;h3&gt;内存和硬盘，直接看这三件事&lt;/h3&gt;&lt;div class=&quot;facts&quot;&gt;
 &lt;div&gt;&lt;strong&gt;内存宽裕 → 文件可被缓存&lt;/strong&gt;输入从硬盘读入内存处理；Linux 缓存读过的文件，重复读取可能少读盘。更多内存不会自动增加显存。&lt;/div&gt;
 &lt;div&gt;&lt;strong&gt;内存不足 → 新任务先等&lt;/strong&gt;不能靠硬盘交换空间（Swap）硬撑；频繁交换增加读写、拖慢整机。GPU 空着也可能开不了任务。&lt;/div&gt;
 &lt;div&gt;&lt;strong&gt;任务退出 → 文件还在&lt;/strong&gt;进程对象释放，文件缓存可能保留且可回收；失败日志、结构和中间文件仍占盘，按保留规则清理。&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;details class=&quot;panel section&quot; id=&quot;pc-recommendation&quot; open&gt;&lt;summary&gt;单卡试租配置单：待同负载实测验收&lt;/summary&gt;
 &lt;p&gt;&lt;strong&gt;试租候选：RTX 6000 Ada Generation 48 GB。&lt;/strong&gt;两套工具分别建环境，共用这张卡，GPU 重计算排队。选择 Ada 是为减少 PXDesign 旧版软件栈对 Blackwell 的额外适配工作，不表示本项目已实机跑通。此推荐以官方小样例及代表性靶点能放入单卡为前提，不覆盖所有输入规模。&lt;/p&gt;
 &lt;p&gt;&lt;strong&gt;“正常运行”怎样验收：&lt;/strong&gt;Protenix v1 真实预测得到可解析结构及对应指标；PXDesign 完整生成、序列设计、AF2／Protenix 评分得到实际结果，零候选也要有筛选记录；等待、取消、失败后可继续使用。先按&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesign/blob/f788441313c84c3074fe9596ac2433f96b15c763/README.md#L449&quot;&gt;官方调试建议&lt;/a&gt;做 10 个样本，扩样时显式指定 500 个并单独验收；调小批量不能保证降低完整流程的显存峰值。&lt;/p&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;部件&lt;/th&gt;&lt;th&gt;推荐要求&lt;/th&gt;&lt;th&gt;配套确认&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;显卡&lt;/td&gt;&lt;td&gt;1× NVIDIA RTX 6000 Ada Generation，48 GB ECC&lt;/td&gt;&lt;td&gt;300 W 主动散热；Protenix／PXDesign 两环境轮流使用同一张卡&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;CPU&lt;/td&gt;&lt;td&gt;1× AMD Threadripper PRO 7975WX，32 核／64 线程&lt;/td&gt;&lt;td&gt;350 W 标称；用于资料准备、解析与结果服务的并发余量&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;主板&lt;/td&gt;&lt;td&gt;1× ASUS Pro WS WRX90E-SAGE SE，或整机商同级平台&lt;/td&gt;&lt;td&gt;八通道 ECC RDIMM、EEB；预留第二卡与独立 NVMe 插槽；此板官方系统栏仅列 Windows，Linux 由整机验收&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;内存&lt;/td&gt;&lt;td&gt;8×32 GB DDR5 ECC RDIMM＝256 GB&lt;/td&gt;&lt;td&gt;按主板兼容清单整套核配；不是实测最低值；升级 512 GB 时更换为 8×64 GB&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;系统盘&lt;/td&gt;&lt;td&gt;独立 2 TB NVMe SSD&lt;/td&gt;&lt;td&gt;系统、环境、基础服务；不承接大量计算临时文件&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;数据盘&lt;/td&gt;&lt;td&gt;独立 4 TB NVMe SSD&lt;/td&gt;&lt;td&gt;放权重、CCD／所选资料、临时文件与结果；关注持续读写、耐久度与容量&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;机箱&lt;/td&gt;&lt;td&gt;1× EEB 全塔工作站机箱，预留两张双槽卡&lt;/td&gt;&lt;td&gt;由整机商确认散热间距、显卡长度及线材空间；有扩展位不代表双卡散热已通过&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;电源／散热&lt;/td&gt;&lt;td&gt;1×1600 W 级高品质电源；匹配 350 W CPU 的散热及完整风道&lt;/td&gt;&lt;td&gt;是工程余量推荐，非模型最低功率要求；以后加 600 W 卡需重新核配&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;运维配套&lt;/td&gt;&lt;td&gt;有线网络、独立结果备份、UPS&lt;/td&gt;&lt;td&gt;UPS 看整机实际瓦数与续航；同盘副本不算独立备份&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;交付&lt;/td&gt;&lt;td&gt;Linux 原生；Protenix／PXDesign 分别锁环境&lt;/td&gt;&lt;td&gt;Ubuntu LTS 与驱动具体组合经样机验收固定；容器／K8s 可后续适配&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;warning&quot;&gt;本期接受 GPU 排队，不接受整个产品停止响应。若单次输入超出 48 GB，先调整经科学确认的输入／配置，或短租 72／96 GB 卡验证；不能靠减少总样本数保证解决。若等待已影响调试效率，再考虑双卡。大内存不补显存，2×48 GB 不合成单任务 96 GB。&lt;/p&gt;
 &lt;p&gt;前置资料：v1 权重、CCD、选用的 MSA／模板资料齐全；本期不默认下载训练集或全量本地搜索库。当前独立 Protenix 采用 PyTorch 2.7.1，首次配置须核验驱动、CUDA 包和自定义内核。&lt;/p&gt;
 &lt;p&gt;独立 Protenix 与 PXDesign 使用不同 PyTorch／CUDA 环境。PXDesign 脚本锁 PyTorch 2.3.1、JAX 0.4.29 和 Protenix v0.5.0+pxd；Ada 方案仍须验收完整流程。若选 72／96 GB Blackwell 卡，还要处理旧依赖适配；增大显存不解决软件兼容。当前 Protenix v2 另拒绝超过 2560 token 的输入，大卡不解除该软件限制。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;已核对资料与源码，未运行 GPU 模型。采购判断以同负载实测为准。&lt;/p&gt;
&lt;/details&gt;
&lt;details class=&quot;panel section&quot; id=&quot;pc-models&quot;&gt;&lt;summary&gt;配卡候选：容量规格，不是模型承载结论&lt;/summary&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;方案&lt;/th&gt;&lt;th&gt;具体型号&lt;/th&gt;&lt;th&gt;区别&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;单卡 48 GB · 试租候选&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-us/products/workstations/rtx-6000/&quot;&gt;RTX 6000 Ada Generation&lt;/a&gt;；其他候选 &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf&quot;&gt;RTX A6000（Ampere）&lt;/a&gt;&lt;/td&gt;&lt;td&gt;均为 300 W 主动散热；两代产品，不能因容量相同就当性能相同；按实际输入试跑&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;双卡，各 48 GB&lt;/td&gt;&lt;td&gt;2×上述同型号卡，整机核配&lt;/td&gt;&lt;td&gt;把两个已验证能放入 48 GB 的任务分别放卡；不等于单任务 96 GB&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;单卡 72 GB&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-5000/&quot;&gt;RTX PRO 5000 72GB Blackwell&lt;/a&gt;&lt;/td&gt;&lt;td&gt;300 W 主动散热；订单写明 72 GB SKU，同系列另有 48 GB 版&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;单卡 96 GB · 容量升配&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000/&quot;&gt;RTX PRO 6000 Blackwell Workstation Edition&lt;/a&gt;&lt;/td&gt;&lt;td&gt;最高 600 W；单任务显存余量更大，不是小批量研发必需，需 Blackwell 软件适配验收&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;双卡 96＋48 GB · 扩展&lt;/td&gt;&lt;td&gt;PRO 6000 Blackwell 96 GB＋RTX 6000 Ada 48 GB&lt;/td&gt;&lt;td&gt;Protenix 与 PXDesign 分卡执行；完整整机要求见下一项，不是当前采购前提&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;48 GB 服务器租赁补充&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.nvidia.com/en-gb/data-center/l40s/&quot;&gt;NVIDIA L40S&lt;/a&gt;&lt;/td&gt;&lt;td&gt;350 W 被动散热，依靠服务器强制风道；不直接替换普通塔式卡&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/details&gt;
&lt;details class=&quot;panel section&quot; id=&quot;pc-dual&quot;&gt;&lt;summary&gt;双卡完整整机扩展单：需要两个 GPU 任务同时计算时再采用&lt;/summary&gt;
 &lt;p&gt;这套扩展的默认分工：GPU 0＝96 GB Protenix；GPU 1＝48 GB PXDesign。空闲卡可接其他已通过该卡容量及环境试跑的任务，运行中的任务不迁卡。PXDesign 在 Ada 卡上避开直接移到 Blackwell 的额外适配；每项任务仍须分别通过容量试跑，混卡不能自动保证并行成功。&lt;/p&gt;
 &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;部件&lt;/th&gt;&lt;th&gt;数量与规格／询配型号&lt;/th&gt;&lt;th&gt;负责内容及配套要求&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;Protenix 显卡&lt;/td&gt;&lt;td&gt;1× RTX PRO 6000 Blackwell Workstation Edition，96 GB&lt;/td&gt;&lt;td&gt;最高 600 W；约 137×305 mm 双槽；核验 Blackwell 环境与贯通散热&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;PXDesign 显卡&lt;/td&gt;&lt;td&gt;1× RTX 6000 Ada Generation，48 GB&lt;/td&gt;&lt;td&gt;最高 300 W；约 112×267 mm 双槽；完整生成及评分都计入本卡占用&lt;/td&gt;&lt;/tr&gt;

 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;CPU 与两卡标称功率合计 1250 W，不是整机实测功耗，尚未计入主板、内存与盘等。2000 W 为工程余量；候选电源不是整机兼容认证。三块物理盘降低系统与数据读写争抢，不是故障隔离或自动备份。&lt;/p&gt;
 &lt;p&gt;上方交互只推演所选单盘或系统／数据双盘，不把这套三盘扩展的 10 TB 合并成一个可用数据盘。双卡选项也只切换 GPU，内存仍按独立选项；实际扩展按本表配置验收。&lt;/p&gt;
 &lt;p&gt;PXDesignBench 的子进程会重新设置 GPU 可见列表，不能仅给父进程设置一次 CUDA_VISIBLE_DEVICES 就声称完成隔离。必须确认父进程、ProteinMPNN、AF2 和 Protenix 评分的实际物理卡归属。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;规格来源：&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.asus.com/motherboards-components/motherboards/workstation/pro-ws-wrx90e-sage-se/techspec/&quot;&gt;ASUS 主板&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.amd.com/en/support/downloads/drivers.html/processors/ryzen-threadripper-pro/amd-ryzen-threadripper-pro-7000-wx-series/amd-ryzen-threadripper-pro-7975wx.html&quot;&gt;AMD CPU&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.fsplifestyle.com/fr/product/cannonpro2000w_12V2X6.html&quot;&gt;FSP 电源&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://phanteks.com/product/enthoo-pro-2-server-edition-tg/&quot;&gt;Phanteks 机箱&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.noctua.at/en/products/nh-u14s-tr5-sp6/compatibility/cpus?socketId=39&amp;amp;vendorId=2&quot;&gt;Noctua 散热&lt;/a&gt; · &lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/bytedance/PXDesignBench/blob/v0.1.2/pxdbench/tools/base.py#L38-L41&quot;&gt;子进程绑定源码&lt;/a&gt;&lt;/p&gt;
&lt;/details&gt;
&lt;details class=&quot;panel section&quot;&gt;&lt;summary&gt;开发验收与依据&lt;/summary&gt;
 &lt;p&gt;Web 展示同一计算入口的执行事实，不复制 Certa 业务状态。输入未就绪、等显卡、等内存、等磁盘空间、读写繁忙分别反馈。PXDesign 评分阶段可能仍有生成模型与子进程占用，不能按阶段名归零。&lt;/p&gt;
 &lt;p&gt;实测记录整机 MemAvailable、任务进程树内存与共享页、每卡实际显存、各挂载点剩余空间与预留、读写等待和延迟；冷启动与重复执行分开测。不要把各进程 RSS 相加后再加一遍文件缓存。&lt;/p&gt;
 &lt;p&gt;取消受理不等于进程退出。父子进程退出并确认清理才释放资源，保留日志和已存结果。核验结构、指标、序列及对应关系；退出码或进度 100% 不能独立代表成功；零候选如实交付说明。&lt;/p&gt;
 &lt;p&gt;准备资料、GPU 计算、整理／查看须真实重叠；约定两个 GPU 重任务并行时，还要验证计算重叠。独立数据盘只隔离系统盘，不保证同盘解压、搜索、写结果互不争抢；两个分区不等于两块物理盘。&lt;/p&gt;
 &lt;p class=&quot;note&quot;&gt;固定源码：Protenix 85767b8；PXDesign f788441。预算放行采用固定顺序演示，不代表已经实现的调度服务。&lt;/p&gt;

&lt;/details&gt;
&lt;div class=&quot;footer&quot;&gt;可离线打开；来源链接需要联网。未执行模型测试；官方基准、源码配置与我方假设已分别标明。&lt;/div&gt;
